[package]
name = "roles_logic_sv2"
version = "3.2.1"
authors = ["The Stratum V2 Developers"]
edition = "2018"
description = "Common handlers for use within SV2 roles"
documentation = "https://docs.rs/roles_logic_sv2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stratum-mining/stratum"
homepage = "https://stratumprotocol.org"
keywords = ["stratum", "mining", "bitcoin", "protocol"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*", "reg-test-block.toml"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitcoin = "0.32.6"
# Protocol/codec versions published with SRI v1.12.0.
binary_sv2 = "=7.0.0"
common_messages_sv2 = "=9.0.0"
mining_sv2 = "=12.0.0"
template_distribution_sv2 = "=7.0.0"
job_declaration_sv2 = "=10.0.0"
framing_sv2 = "=8.0.0"
tracing = "0.1"
nohash-hasher = "0.2.0"
primitive-types = "0.13.1"
hex = { package = "hex-conservative", version = "0.3.0" }
quickcheck = { version = "1.0.3", optional = true }

[dev-dependencies]
codec_sv2 = { version = "=7.0.0", features = ["noise_sv2"] }
quickcheck = "1.0.3"
quickcheck_macros = "1"
rand = "0.8.5"
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1.0.89", features = ["derive", "alloc"], default-features = false }

[features]
prop_test = ["dep:quickcheck"]
# Code coverage tools may conflict with the nopanic logic, so we can disable it when needed
disable_nopanic = []
